services:
  reservas-db:
    image: mysql:8.4
    container_name: reservas-db
    environment:
      MYSQL_ROOT_PASSWORD: reservas_root_pass
      MYSQL_DATABASE: reservasdb
      MYSQL_USER: reservas_user
      MYSQL_PASSWORD: reservas_pass
    healthcheck:
        test:
            - CMD-SHELL
            - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 40s
    volumes: [reservas-db-data:/var/lib/mysql]
    networks: [reservas-net]

  reservas-api:
    build: { context: ./backend }
    image: reservas-api:v1
    container_name: reservas-api
    ports: ["3001:3000"]
    environment:
      PORT: 3000
      DB_HOST: reservas-db
      DB_PORT: 3306
      DB_NAME: reservasdb
      DB_USER: reservas_user
      DB_PASSWORD: reservas_pass
      APP_VERSION: v1
      SEED_DEMO: true
    healthcheck:
      test:
          - CMD
          - node
          - -e
          - "fetch('http://127.0.0.1:3000/health')
           .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" 
    networks: [reservas-net]

  reservas-frontend:
    build: { context: ./frontend }
    image: reservas-frontend:v1
    container_name: reservas-frontend
    ports: ["3000:8080"]
    environment:
        API_HOST: reservas-api
        API_PORT: 3000
    networks: [reservas-net]

networks:
  reservas-net: { name: reservas-net }

volumes:
  reservas-db-data: { name: reservas-db-data }
