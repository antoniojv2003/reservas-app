services:
  reservas-db:
    image: mysql:8.4
    container_name: reservas-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Falta MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Falta MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
    healthcheck:
        test:
            - CMD-SHELL
            - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 40s
    volumes: [reservas-db-data:/var/lib/mysql]
    networks: [reservas-net]

  reservas-api:
    build: { context: ./backend }
    image: reservas-api:v1
    container_name: reservas-api
    ports: ["3001:3000"]
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-reservas-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Falta DB_NAME en .env}
      DB_USER: ${DB_USER:?Falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      APP_VERSION: ${APP_VERSION:-v1}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      reservas-db:
        condition: service_healthy
    
    healthcheck:
      test:
          - CMD
          - node
          - -e
          - "fetch('http://127.0.0.1:3000/health')
           .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" 
    networks: [reservas-net]

  reservas-frontend:
    build: { context: ./frontend }
    image: reservas-frontend:v1
    container_name: reservas-frontend
    ports: ["3000:8080"]
    environment:
      API_HOST: ${API_HOST:-reservas-api}
      API_PORT: ${API_PORT:-3000}
    depends_on:
          reservas-api:
            condition: service_healthy
    healthcheck:
        test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 5s
    networks: [reservas-net]

networks:
  reservas-net: { name: reservas-net }

volumes:
  reservas-db-data: { name: reservas-db-data }
