apiVersion: v1
kind: ConfigMap
metadata:
  name: reservas-api-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.api.config.DB_HOST | quote }}
  DB_PORT: {{ .Values.api.config.DB_PORT | quote }}
  DB_NAME: {{ .Values.api.config.DB_NAME | quote }}
  PORT: {{ .Values.api.config.PORT | quote }}
  SEED_DEMO: {{ .Values.api.config.SEED_DEMO | quote }}
