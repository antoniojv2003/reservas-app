apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.secret.name }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MYSQL_USER: {{ .Values.db.secret.MYSQL_USER | quote }}
  MYSQL_PASSWORD: {{ .Values.db.secret.MYSQL_PASSWORD | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.db.secret.MYSQL_ROOT_PASSWORD | quote }}
