apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.api.name }}
  name: {{ .Values.api.name }}
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - name: 3000-3000
      port: {{ .Values.api.port }}
      protocol: TCP
      targetPort: {{ .Values.api.port }}
  selector:
    app: {{ .Values.api.name }}
  type: {{ .Values.api.service.type }}
