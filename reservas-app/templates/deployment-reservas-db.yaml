apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.db.name }}
  name: {{ .Values.db.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.db.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.db.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.db.name }}
    spec:
      containers:
        - name: {{ .Values.db.name }}
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          envFrom:
            - secretRef:
                name: {{ .Values.db.secret.name }}
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: reservas-api-config
                  key: DB_NAME
          ports:
            - containerPort: {{ .Values.db.port }}
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
              subPath: mysql
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: {{ .Values.db.pvc.name }}
