apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reservas-frontend
  name: reservas-frontend
  namespace: reservas-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservas-frontend
  template:
    metadata:
      labels:
        app: reservas-frontend
    spec:
      containers:
        - name: reservas-frontend
          image: antoniojv03/reservas-frontend:v1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: reservas-frontend-config
