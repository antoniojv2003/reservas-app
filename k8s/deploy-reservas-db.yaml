apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reservas-db
  name: reservas-db
  namespace: reservas-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-db
  template:
    metadata:
      labels:
        app: reservas-db
    spec:
      containers:
        - name: reservas-db
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "reservasa_root_pass"
            - name: MYSQL_DATABASE
              value: "reservasdb"
            - name: MYSQL_USER
              value: "reservas_user"
            - name: MYSQL_PASSWORD
              value: "reservas_pass"
          ports:
            - containerPort: 3306
