apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reservas-api
  name: reservas-api
  namespace: reservas-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservas-api
  template:
    metadata:
      labels:
        app: reservas-api
    spec:
      containers:
        - name: reservas-api
          image: antoniojv03/reservas-api:v1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: reservas-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
